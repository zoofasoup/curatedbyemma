<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Control · ahmadzufaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Rethink+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.985 0.004 85);
    --surface: oklch(1 0 0);
    --rail: oklch(0.963 0.006 85);
    --hover: oklch(0.945 0.007 85);
    --line: oklch(0.912 0.006 85);
    --line-strong: oklch(0.86 0.008 85);
    --ink: oklch(0.21 0.012 85);
    --ink-2: oklch(0.43 0.012 85);
    --ink-3: oklch(0.53 0.01 85);
    --accent: oklch(0.44 0.085 162);
    --accent-hover: oklch(0.38 0.085 162);
    --accent-soft: oklch(0.955 0.025 162);
    --star: oklch(0.7 0.14 75);
    --warn-ink: oklch(0.47 0.1 70);
    --warn-soft: oklch(0.96 0.035 80);
    --danger: oklch(0.52 0.17 25);
    --danger-soft: oklch(0.96 0.025 25);
    --radius: 8px;
    --radius-sm: 6px;
    --font: "Rethink Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 14px/1.5 var(--font); font-feature-settings: "tnum" 1, "cv11" 1;
    -webkit-font-smoothing: antialiased; caret-color: var(--accent);
    scrollbar-color: var(--line-strong) transparent;
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -0.01em; }
  .icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface);
    font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: translateY(0.5px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: oklch(0.99 0 0); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { color: var(--ink); background: var(--hover); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn.is-done { color: var(--accent); border-color: var(--accent); }

  /* ---------- PIN gate ---------- */
  .gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .gate-box { width: 100%; max-width: 320px; }
  .gate h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 4px; }
  .gate p { margin: 0 0 24px; color: var(--ink-2); }
  .field-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .input {
    width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    background: var(--surface); font: inherit; font-size: 16px; color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
  .gate .input { letter-spacing: 0.4em; font-family: var(--mono); }
  .gate .btn { width: 100%; justify-content: center; height: 40px; margin-top: 12px; font-size: 14px; }
  .field-error { color: var(--danger); font-size: 13px; margin: 8px 0 0; }

  /* ---------- App shell ---------- */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100dvh; }
  .rail {
    background: var(--rail); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100dvh; padding: 14px 10px;
  }
  .workspace { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
  .workspace-mark {
    width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
  }
  .workspace-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
  .workspace-sub { font-size: 12px; color: var(--ink-3); }
  .rail-heading { font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 14px 8px 6px; }
  .ip-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .ip-link {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-sm);
    background: transparent; cursor: pointer; text-align: left; transition: background-color .15s;
  }
  .ip-link:hover { background: var(--hover); }
  .ip-link[aria-current="page"] { background: var(--surface); box-shadow: 0 1px 2px oklch(0.2 0.01 85 / 0.06), 0 0 0 1px var(--line); }
  .ip-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; }
  .ip-name { font-weight: 500; font-size: 13.5px; }
  .ip-handle { font-size: 12px; color: var(--ink-3); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: auto; flex: none; }
  .status-dot.is-paused { background: var(--line-strong); }
  .ip-add { color: var(--ink-2); font-size: 13px; }
  .ip-add .icon { width: 15px; height: 15px; margin: 0 4.5px; }
  .rail-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 10px 6px; display: flex; align-items: center; gap: 10px; }
  .user-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .user-name { font-size: 13px; font-weight: 500; }
  .user-mode { font-size: 12px; color: var(--ink-3); }
  .rail-foot .btn { margin-left: auto; padding: 0 7px; }

  .main { min-width: 0; }
  .page-head { padding: 28px 40px 0; max-width: 1180px; }
  .title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .title-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .title-row h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
  .title-meta { color: var(--ink-2); font-size: 13.5px; }
  .title-actions { margin-left: auto; display: flex; gap: 8px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 18px 0 0; padding: 0; }
  .facts div { display: flex; gap: 8px; align-items: baseline; }
  .facts dt { color: var(--ink-3); font-size: 13px; }
  .facts dd { margin: 0; font-size: 13px; font-weight: 500; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 99px; font-size: 12px; font-weight: 500; }
  .pill-ok { background: var(--accent-soft); color: var(--accent); }
  .pill-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .pill-muted { background: var(--hover); color: var(--ink-2); }
  .pill-ok::before, .pill-warn::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 22px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; padding: 9px 10px 11px; border: 0; background: none; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; transition: color .15s;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
  .tab .count { color: var(--ink-3); font-weight: 400; margin-left: 4px; }

  .panel { padding: 24px 40px 64px; max-width: 1180px; }
  .panel-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .panel-intro h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  .panel-intro p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 68ch; }

  /* ---------- Table ---------- */
  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--ink-3); padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background-color .12s; }
  tbody tr:hover { background: oklch(0.985 0.004 85); }
  .num { text-align: right; white-space: nowrap; }
  .slot { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); width: 44px; }
  .product { display: flex; align-items: center; gap: 12px; min-width: 280px; }
  .thumb { width: 40px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); object-fit: contain; padding: 3px; flex: none; }
  .product-title { font-weight: 500; line-height: 1.35; }
  .product-hook { color: var(--ink-3); font-size: 12.5px; }
  .rating { display: inline-flex; align-items: center; gap: 4px; }
  .rating svg { width: 13px; height: 13px; fill: var(--star); stroke: none; }
  .muted { color: var(--ink-3); }
  .row-link { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-size: 13px; }
  .row-link:hover { color: var(--accent); }
  .row-link .icon { width: 14px; height: 14px; }

  /* ---------- Content list ---------- */
  .post-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .post { display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; padding: 16px; border-bottom: 1px solid var(--line); }
  .post:last-child { border-bottom: 0; }
  .post-media { width: 56px; height: 70px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--line); }
  .post-media.is-text { display: grid; place-items: center; background: var(--rail); color: var(--ink-3); font-size: 11.5px; }
  .post-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .post-title { font-weight: 600; font-size: 13.5px; }
  .post-body { white-space: pre-line; color: var(--ink-2); font-size: 13.5px; max-width: 70ch; margin: 0; }
  .post-body.is-clamped { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .post-expand { border: 0; background: none; padding: 0; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .post-expand:hover { color: var(--ink); }
  .post-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }

  /* ---------- Reply tester ---------- */
  .tester { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .textarea { width: 100%; min-height: 132px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); font: inherit; font-size: 14px; line-height: 1.55; resize: vertical; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
  .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
  .chip { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 12.5px; color: var(--ink-2); cursor: pointer; transition: border-color .15s, color .15s; }
  .chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .result { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; min-height: 196px; }
  .result-empty { color: var(--ink-3); font-size: 13.5px; display: grid; gap: 4px; }
  .result-empty strong { color: var(--ink-2); font-weight: 500; }
  .result-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .result-product { color: var(--ink-2); font-size: 13px; }
  .reply-text { font-size: 14.5px; line-height: 1.6; margin: 0 0 14px; }
  .checks { list-style: none; padding: 12px 0 0; margin: 0; border-top: 1px solid var(--line); display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
  .checks li { display: flex; align-items: center; gap: 6px; }
  .checks .icon { width: 14px; height: 14px; color: var(--accent); }
  .checks .is-fail { color: var(--danger); }
  .checks .is-fail .icon { color: var(--danger); }

  /* ---------- Persona ---------- */
  .persona { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .persona section { padding: 18px; border-right: 1px solid var(--line); }
  .persona section:last-child { border-right: 0; }
  .persona h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
  .persona ul, .persona ol { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; display: grid; gap: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: 4px; background: var(--danger-soft); color: var(--danger); }
  .persona-bio { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; color: var(--ink-2); font-size: 13.5px; }
  .persona-bio img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }

  /* ---------- Lander ---------- */
  .lander { display: grid; grid-template-columns: 390px 1fr; gap: 32px; align-items: start; }
  .device { width: 390px; height: 760px; border: 1px solid var(--line-strong); border-radius: 28px; padding: 8px; background: var(--surface); box-shadow: 0 12px 32px -12px oklch(0.2 0.01 85 / 0.18); }
  .device iframe { width: 100%; height: 100%; border: 0; border-radius: 21px; background: var(--bg); }
  .kv { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; font-size: 13.5px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; }

  /* ---------- Activity ---------- */
  .log { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 12px 14px; max-height: 420px; overflow: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--ink-2); }
  .log-empty { color: var(--ink-3); font-family: var(--font); font-size: 13.5px; }

  /* ---------- Empty IP ---------- */
  .empty-ip { max-width: 520px; padding: 48px 40px; }
  .empty-ip h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.015em; }
  .empty-ip p { color: var(--ink-2); margin: 0 0 16px; }
  .empty-ip ol { color: var(--ink-2); padding-left: 18px; display: grid; gap: 6px; margin: 0 0 20px; }
  .empty-ip code { font-family: var(--mono); font-size: 12.5px; background: var(--rail); padding: 1px 5px; border-radius: 4px; color: var(--ink); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); opacity: 0; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; transition: opacity .2s var(--ease), transform .2s var(--ease); pointer-events: none; }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) {
    .tester, .lander { grid-template-columns: 1fr; }
    .persona { grid-template-columns: 1fr; }
    .persona section { border-right: 0; border-bottom: 1px solid var(--line); }
    .persona section:last-child { border-bottom: 0; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; flex-direction: row; align-items: center; gap: 8px; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .workspace { padding: 0 6px 0 0; }
    .workspace-text, .rail-heading, .ip-handle, .rail-foot .user-text, .rail-foot .user-mark { display: none; }
    .ip-list { display: flex; gap: 4px; }
    .rail-foot { margin: 0 0 0 auto; border: 0; padding: 4px; }
    .page-head { padding: 20px 16px 0; }
    .panel { padding: 18px 16px 48px; }
    .title-actions { margin-left: 0; width: 100%; }
    .product { min-width: 0; }
    th, td { padding: 10px 10px; }
    .post { grid-template-columns: 44px 1fr; }
    .post-media { width: 44px; height: 56px; }
    .post-actions { grid-column: 2; flex-direction: row; }
    .device { width: 100%; max-width: 390px; height: 700px; }
    .col-hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- PIN gate -->
<main class="gate" id="gate" hidden>
  <form class="gate-box" id="gate-form" novalidate>
    <h1>Control</h1>
    <p>Private workspace for ahmadzufaar's affiliate IPs.</p>
    <label class="field-label" for="pin">PIN</label>
    <input class="input" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" aria-describedby="pin-error">

    <button class="btn btn-primary" type="submit">Unlock</button>

</main>

<!-- App -->
<div class="app" id="app" hidden>

  </nav>

const state = { ip: null, tab: "catalog", live: false, published: {}, logs: [] };

/* ---------- Auth ---------- */
function showApp() { $("#gate").hidden = true; $("#app").hidden = false; boot(); }
function showGate() { $("#app").hidden = true; $("#gate").hidden = false; $("#pin").value = ""; $("#pin").focus(); }
$("#gate-form").addEventListener("submit", e => {
  e.preventDefault();
  const ok = $("#pin").value.trim() === PIN;
  $("#pin").setAttribute("aria-invalid", String(!ok));
  $("#pin-error").hidden = ok;
  if (ok) { sessionStorage.setItem(AUTH_KEY, "1"); showApp(); } else { $("#pin").value = ""; $("#pin").focus(); }
});
$("#lock-btn").addEventListener("click", () => { sessionStorage.removeItem(AUTH_KEY); showGate(); });

/* ---------- Live mode (localhost server) ---------- */
async function detectLive() {
  try {
    const r = await fetch("/api/broadcast", { cache: "no-store" });
    if (!r.ok) throw 0;
    const data = await r.json();
    state.live = true;
    state.published = {};
    (data.queue || []).forEach(q => { if (q.published) state.published[q.id] = q.published_at; });
  } catch { state.live = false; }
  $("#mode-label").textContent = state.live ? "Live · localhost" : "Read-only";
}
async function fetchLogs() {
  if (!state.live) return;
  try { const r = await fetch("/api/logs", { cache: "no-store" }); state.logs = (await r.json()).logs || []; } catch {}
}

/* ---------- Routing ---------- */
function readHash() {
  const [ip, tab] = location.hash.replace(/^#\/?/, "").split("/");
  state.ip = ip || PROJECTS[0].id;
  state.tab = tab || "catalog";
}
function go(ip, tab) { location.hash = `#/${ip}/${tab || "catalog"}`; }
window.addEventListener("hashchange", () => { readHash(); render(); });

/* ---------- Rail ---------- */
function renderRail() {
  $("#ip-list").innerHTML = PROJECTS.map(p => `
    <li><button class="ip-link" data-ip="${p.id}" ${state.ip === p.id ? 'aria-current="page"' : ""}>
      <img class="ip-avatar" src="${p.avatar}" alt="">
      <span><span class="ip-name">${esc(p.persona)}</span><br><span class="ip-handle">${esc(p.handle)}</span></span>
      <span class="status-dot ${p.status === "active" ? "" : "is-paused"}" title="${p.status === "active" ? "Active" : "Paused"}"></span>
    </button></li>`).join("") + `
    <li><button class="ip-link ip-add" data-ip="new" ${state.ip === "new" ? 'aria-current="page"' : ""}>${icons.plus}<span>New IP</span></button></li>`;
  document.querySelectorAll(".ip-link").forEach(b => b.addEventListener("click", () => go(b.dataset.ip)));
}

/* ---------- Main ---------- */
const TABS = [
  ["catalog", "Catalog", p => p.catalog.length],
  ["content", "Content", p => p.posts.length],
  ["replies", "Reply tester"],
  ["persona", "Persona"],
  ["lander", "Lander"],
  ["activity", "Activity", null, true]
];

function render() {
  renderRail();
  const main = $("#main");
  if (state.ip === "new") { main.innerHTML = renderNewIp(); return; }
  const p = PROJECTS.find(x => x.id === state.ip) || PROJECTS[0];
  const tabs = TABS.filter(t => !t[3] || state.live);
  if (!tabs.some(t => t[0] === state.tab)) state.tab = "catalog";
  const publishedCount = p.posts.filter(x => state.published[x.id]).length;

  main.innerHTML = `
    <header class="page-head">
      <div class="title-row">
        <img class="title-avatar" src="${p.avatar}" alt="">
        <div>
          <h1>${esc(p.name)}</h1>
          <div class="title-meta">${esc(p.handle)} · ${esc(p.market)}</div>
        </div>
        <div class="title-actions">
          <a class="btn" href="${p.threadsUrl}" target="_blank" rel="noopener">Threads ${icons.external}</a>
          <a class="btn" href="${p.landerUrl}" target="_blank" rel="noopener">Lander ${icons.external}</a>
        </div>
      </div>
      <dl class="facts">
        <div><dt>Status</dt><dd><span class="pill ${p.status === "active" ? "pill-ok" : "pill-muted"}">${p.status === "active" ? "Active" : "Paused"}</span></dd></div>
        <div><dt>Tracking ID</dt><dd class="mono">${esc(p.tag)}</dd></div>
        <div><dt>Slots</dt><dd>#1–#${p.catalog.length}</dd></div>
        <div><dt>Posts</dt><dd>${state.live ? `${publishedCount} of ${p.posts.length} published` : `${p.posts.length} drafted`}</dd></div>
      </dl>
      <div class="tabs" role="tablist" aria-label="${esc(p.persona)} sections">
        ${tabs.map(([id, label, count]) => `
          <button class="tab" role="tab" id="tab-${id}" aria-selected="${state.tab === id}" aria-controls="panel" tabindex="${state.tab === id ? 0 : -1}" data-tab="${id}">
            ${label}${count ? `<span class="count">${count(p)}</span>` : ""}
          </button>`).join("")}
      </div>
    </header>
    <section class="panel" id="panel" role="tabpanel" aria-labelledby="tab-${state.tab}">
      ${({ catalog: renderCatalog, content: renderContent, replies: renderReplies, persona: renderPersona, lander: renderLander, activity: renderActivity })[state.tab](p)}
    </section>`;

  const tabEls = [...document.querySelectorAll(".tab")];
  tabEls.forEach((t, i) => {
    t.addEventListener("click", () => go(p.id, t.dataset.tab));
    t.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const next = tabEls[(i + (e.key === "ArrowRight" ? 1 : -1) + tabEls.length) % tabEls.length];
      next.focus(); go(p.id, next.dataset.tab);
    });
  });
  bindPanel(p);
}

/* ---------- Panel behaviour ---------- */
let logTimer = null;
function bindPanel(p) {
  clearInterval(logTimer);

  document.querySelectorAll("[data-expand]").forEach(b => b.addEventListener("click", () => {
    const body = b.previousElementSibling;
    const open = body.classList.toggle("is-clamped");
    b.textContent = open ? "Show full post" : "Show less";
  }));

  document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const post = p.posts.find(x => x.id === b.dataset.copy);
    await copy(post.text, b);
  }));

  document.querySelectorAll("[data-publish]").forEach(b => b.addEventListener("click", () => publish(p, b)));

  const input = $("#sim-input");
  if (input) {
    document.querySelectorAll("[data-sample]").forEach(c => c.addEventListener("click", () => { input.value = c.dataset.sample; runMatch(p); }));
    $("#sim-run").addEventListener("click", () => runMatch(p));
    input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) runMatch(p); });
  }

  const reload = $("#reload-lander");
  if (reload) reload.addEventListener("click", () => { const f = $(".device iframe"); f.src = p.landerUrl + "?t=" + Date.now(); });

  if (state.tab === "activity") {
    logTimer = setInterval(async () => {
      await fetchLogs();
      const el = $("#log");
      if (el) { el.innerHTML = state.logs.length ? state.logs.map(esc).join("<br>") : '<span class="log-empty">Nothing logged yet.</span>'; el.scrollTop = el.scrollHeight; }
    }, 3000);
  }
}

function matchSlot(p, text) {
  const t = text.toLowerCase();
  const has = list => list.some(k => t.includes(k));
  for (const r of p.replyRules) {
    if (r.all ? r.all.every(has) : has(r.any)) return r.slot;
  }
  return null;
}

function runMatch(p) {
  const text = $("#sim-input").value.trim();
  const out = $("#sim-result");
  if (!text) { $("#sim-input").focus(); return; }
  const slot = matchSlot(p, text);
  if (!slot) {
    out.innerHTML = `<div class="result-empty"><strong>No slot matches this post</strong>${esc(p.persona)} stays quiet here. Replying off-topic reads as spam. Add a keyword rule if this should map to a product.</div>`;
    return;
  }
  const item = p.catalog.find(c => c.slot === slot);
  const reply = p.replies[slot];
  const lower = reply.toLowerCase();
  const bannedHit = p.banned.find(b => lower.includes(b));
  const hasLink = /https?:\/\/|amzn\.|\.com/.test(lower);
  out.innerHTML = `
    <div class="result-head"><span class="pill pill-ok">Slot #${slot}</span><span class="result-product">${esc(item.title)}</span></div>
    <p class="reply-text">${esc(reply)}</p>
    <div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn btn-sm" id="copy-reply">${icons.copy}Copy reply</button></div>
    <ul class="checks">
      <li class="${hasLink ? "is-fail" : ""}">${hasLink ? icons.x : icons.check}${hasLink ? "Contains a link" : "No links in the reply"}</li>
      <li class="${bannedHit ? "is-fail" : ""}">${bannedHit ? icons.x : icons.check}${bannedHit ? `Uses banned phrase “${esc(bannedHit)}”` : "No banned phrases"}</li>
      <li>${icons.check}Points to bio #${slot}</li>
    </ul>`;
  $("#copy-reply").addEventListener("click", e => copy(reply, e.currentTarget));
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  const orig = btn.innerHTML;
  btn.innerHTML = `${icons.check}Copied`; btn.classList.add("is-done");
  setTimeout(() => { btn.innerHTML = orig; btn.classList.remove("is-done"); }, 1600);
}

async function publish(p, btn) {
  const id = btn.dataset.publish;
  document.querySelectorAll("[data-publish]").forEach(b => b.disabled = true);
  btn.textContent = "Publishing…";
  try {
    const r = await fetch("/api/broadcast/publish", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    toast("Publishing in the background. This takes about a minute.");
    const started = Date.now();
    const poll = setInterval(async () => {
      await detectLive();
      if (state.published[id]) { clearInterval(poll); toast("Posted to Threads."); render(); }
      else if (Date.now() - started > 150000) { clearInterval(poll); toast("No confirmation yet. Check the Activity tab."); render(); }
    }, 5000);
  } catch (err) {
    toast(`Couldn't start publishing: ${err.message}`);
    render();
  }
}

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("is-on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("is-on"), 3200);
}

/* ---------- Boot ---------- */
async function boot() { readHash(); render(); await detectLive(); await fetchLogs(); render(); }
if (sessionStorage.getItem(AUTH_KEY)) showApp(); else showGate();
</script>
