<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Control · ahmadzufaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Rethink+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.985 0.004 85);
    --surface: oklch(1 0 0);
    --rail: oklch(0.963 0.006 85);
    --hover: oklch(0.945 0.007 85);
    --line: oklch(0.912 0.006 85);
    --line-strong: oklch(0.86 0.008 85);
    --ink: oklch(0.21 0.012 85);
    --ink-2: oklch(0.43 0.012 85);
    --ink-3: oklch(0.53 0.01 85);
    --accent: oklch(0.44 0.085 162);
    --accent-hover: oklch(0.38 0.085 162);
    --accent-soft: oklch(0.955 0.025 162);
    --star: oklch(0.7 0.14 75);
    --warn-ink: oklch(0.47 0.1 70);
    --warn-soft: oklch(0.96 0.035 80);
    --danger: oklch(0.52 0.17 25);
    --danger-soft: oklch(0.96 0.025 25);
    --radius: 8px;
    --radius-sm: 6px;
    --font: "Rethink Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 14px/1.5 var(--font); font-feature-settings: "tnum" 1, "cv11" 1;
    -webkit-font-smoothing: antialiased; caret-color: var(--accent);
    scrollbar-color: var(--line-strong) transparent;
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -0.01em; }
  .icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface);
    font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: translateY(0.5px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn-primary:hover { background: oklch(0.12 0.01 85); border-color: oklch(0.12 0.01 85); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { color: var(--ink); background: var(--hover); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn.is-done { color: var(--accent); border-color: var(--accent); }

  /* ---------- PIN gate ---------- */
  .gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .gate-box { width: 100%; max-width: 320px; }
  .gate h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 4px; }
  .gate p { margin: 0 0 24px; color: var(--ink-2); }
  .field-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .input {
    width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    background: var(--surface); font: inherit; font-size: 16px; color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
  .gate .input { letter-spacing: 0.4em; font-family: var(--mono); }
  .gate .btn { width: 100%; justify-content: center; height: 40px; margin-top: 12px; font-size: 14px; }
  .field-error { color: var(--danger); font-size: 13px; margin: 8px 0 0; }

  /* ---------- App shell ---------- */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100dvh; }
  .rail {
    background: var(--rail); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100dvh; padding: 14px 10px;
  }
  .workspace { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
  .workspace-mark {
    width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
  }
  .workspace-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
  .workspace-sub { font-size: 12px; color: var(--ink-3); }
  .rail-heading { font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 14px 8px 6px; }
  .ip-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .ip-link {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-sm);
    background: transparent; cursor: pointer; text-align: left; transition: background-color .15s;
  }
  .ip-link:hover { background: var(--hover); }
  .ip-link[aria-current="page"] { background: var(--surface); box-shadow: 0 1px 2px oklch(0.2 0.01 85 / 0.06), 0 0 0 1px var(--line); }
  .ip-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; }
  .ip-name { font-weight: 500; font-size: 13.5px; }
  .ip-handle { font-size: 12px; color: var(--ink-3); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: auto; flex: none; }
  .status-dot.is-paused { background: var(--line-strong); }
  .ip-add { color: var(--ink-2); font-size: 13px; }
  .ip-add .icon { width: 15px; height: 15px; margin: 0 4.5px; }
  .rail-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 10px 6px; display: flex; align-items: center; gap: 10px; }
  .user-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .user-name { font-size: 13px; font-weight: 500; }
  .user-mode { font-size: 12px; color: var(--ink-3); }
  .rail-foot .btn { margin-left: auto; padding: 0 7px; }

  .main { min-width: 0; }
  .page-head { padding: 28px 40px 0; max-width: 1180px; }
  .title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .title-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .title-row h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
  .title-meta { color: var(--ink-2); font-size: 13.5px; }
  .title-actions { margin-left: auto; display: flex; gap: 8px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 18px 0 0; padding: 0; }
  .facts div { display: flex; gap: 8px; align-items: baseline; }
  .facts dt { color: var(--ink-3); font-size: 13px; }
  .facts dd { margin: 0; font-size: 13px; font-weight: 500; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 99px; font-size: 12px; font-weight: 500; }
  .pill-ok { background: var(--accent-soft); color: var(--accent); }
  .pill-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .pill-muted { background: var(--hover); color: var(--ink-2); }
  .pill-ok::before, .pill-warn::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 22px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; padding: 10px 14px 12px; border: 0; background: none; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; transition: color .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
  .tab-badge {
    display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 18px;
    padding: 0 6px; font-size: 11px; font-weight: 600; border-radius: 99px; background: var(--line); color: var(--ink-2);
  }
  .tab[aria-selected="true"] .tab-badge { background: var(--ink); color: #fff; }
  .tab-badge.is-alert { background: var(--accent); color: #fff; }

  .panel { padding: 24px 40px 64px; max-width: 1180px; }
  .panel-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .panel-intro h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  .panel-intro p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 68ch; }

  /* ---------- Table ---------- */
  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-3); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background-color .12s; }
  tbody tr:hover { background: oklch(0.985 0.004 85); }
  .num { text-align: right; white-space: nowrap; }
  .slot { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink-2); width: 44px; }
  .product { display: flex; align-items: center; gap: 12px; min-width: 280px; }
  .thumb { width: 44px; height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); object-fit: contain; padding: 3px; flex: none; }
  .product-title { font-weight: 500; line-height: 1.35; }
  .product-hook { color: var(--ink-3); font-size: 12.5px; }
  .rating { display: inline-flex; align-items: center; gap: 4px; }
  .rating svg { width: 13px; height: 13px; fill: var(--star); stroke: none; }
  .muted { color: var(--ink-3); }
  .row-link { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-size: 13px; }
  .row-link:hover { color: var(--accent); }
  .row-link .icon { width: 14px; height: 14px; }

  /* ---------- Content list ---------- */
  .post-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .post { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; padding: 18px; border-bottom: 1px solid var(--line); }
  .post:last-child { border-bottom: 0; }
  .post-media { width: 64px; height: 80px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--line); }
  .post-media.is-text { display: grid; place-items: center; background: var(--rail); color: var(--ink-3); font-size: 11.5px; }
  .post-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .post-title { font-weight: 600; font-size: 14px; }
  .post-body { white-space: pre-line; color: var(--ink-2); font-size: 13.5px; max-width: 70ch; margin: 0; }
  .post-body.is-clamped { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .post-expand { border: 0; background: none; padding: 0; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .post-expand:hover { color: var(--ink); }
  .post-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }

  /* ---------- Reply tester & Persona Sandbox ---------- */
  .tester { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .textarea { width: 100%; min-height: 132px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); font: inherit; font-size: 14px; line-height: 1.55; resize: vertical; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
  .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
  .chip { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 12.5px; color: var(--ink-2); cursor: pointer; transition: border-color .15s, color .15s; }
  .chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .result { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; min-height: 196px; }
  .result-empty { color: var(--ink-3); font-size: 13.5px; display: grid; gap: 4px; }
  .result-empty strong { color: var(--ink-2); font-weight: 500; }
  .result-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .result-product { color: var(--ink-2); font-size: 13px; }
  .reply-text { font-size: 14px; line-height: 1.6; margin: 0 0 14px; }
  .checks { list-style: none; padding: 12px 0 0; margin: 0; border-top: 1px solid var(--line); display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
  .checks li { display: flex; align-items: center; gap: 6px; }
  .checks .icon { width: 14px; height: 14px; color: var(--accent); }
  .checks .is-fail { color: var(--danger); }
  .checks .is-fail .icon { color: var(--danger); }

  /* ---------- Persona & Guardrails ---------- */
  .persona-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
  .persona-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px; }
  .persona-card h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-3); }
  .persona-card ul, .persona-card ol { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; display: grid; gap: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .banned-tag { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--danger-soft); color: var(--danger); text-decoration: line-through; }
  .persona-bio { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; padding: 16px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 13.5px; }
  .persona-bio img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }

  /* ---------- Radar Topics & Actions ---------- */
  .radar-topics { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .topic-pill { height: 28px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 99px; background: var(--surface); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--ink-2); transition: all .15s; }
  .topic-pill:hover, .topic-pill.is-active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- Side-by-Side Approval Review Cards ---------- */
  .approval-card {
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 20px;
    margin-bottom: 16px; box-shadow: 0 1px 3px oklch(0.2 0.01 85 / 0.03); transition: border-color .15s, box-shadow .15s;
  }
  .approval-card:hover { border-color: var(--line-strong); box-shadow: 0 3px 8px -2px oklch(0.2 0.01 85 / 0.06); }
  .approval-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .approval-split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .col-complaint { background: var(--rail); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; flex-direction: column; }
  .col-reply { background: oklch(0.985 0.015 150); border: 1px solid oklch(0.86 0.04 150); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; flex-direction: column; }
  .col-tag-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .col-body { font-size: 13.5px; line-height: 1.6; color: var(--ink); margin: 0; flex-grow: 1; }
  .col-complaint .col-body { color: var(--ink-2); font-style: normal; }
  .approval-card-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; }

  /* ---------- Console Drawer & Audit ---------- */
  .console-drawer { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 24px; overflow: hidden; }
  .console-summary { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; list-style: none; font-size: 12.5px; user-select: none; }
  .console-summary::-webkit-details-marker { display: none; }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.85); } }

  .exp-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
  .exp-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; }
  .exp-card-label { font-size: 11px; color: var(--ink-3); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .exp-card-val { font-size: 22px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.02em; color: var(--ink); }
  .exp-card-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .progress-bar-bg { width: 100%; height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .tier-winner { color: oklch(0.44 0.12 145); background: oklch(0.95 0.04 145); border-color: oklch(0.85 0.08 145); }
  .tier-testing { color: oklch(0.48 0.1 80); background: oklch(0.96 0.03 80); border-color: oklch(0.88 0.06 80); }
  .tier-low { color: var(--ink-3); background: var(--rail); border-color: var(--line); }

  /* ---------- Lander Slide-over Modal ---------- */
  .lander-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
  .lander-modal.is-open { opacity: 1; pointer-events: auto; }
  .lander-modal-box { background: var(--surface); border-radius: 16px; max-width: 860px; width: 100%; max-height: 90vh; overflow: auto; padding: 28px; position: relative; box-shadow: 0 20px 48px -12px rgba(0,0,0,0.25); display: grid; grid-template-columns: 320px 1fr; gap: 28px; align-items: center; }
  .lander-modal-box .device { width: 320px; height: 560px; border-radius: 24px; padding: 6px; }
  .lander-modal-box .device iframe { border-radius: 18px; }
  .lander-modal-close { position: absolute; top: 18px; right: 18px; background: none; border: 0; cursor: pointer; color: var(--ink-2); font-size: 16px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
  .lander-modal-close:hover { background: var(--hover); color: var(--ink); }

  /* ---------- Empty IP ---------- */
  .empty-ip { max-width: 520px; padding: 48px 40px; }
  .empty-ip h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.015em; }
  .empty-ip p { color: var(--ink-2); margin: 0 0 16px; }
  .empty-ip ol { color: var(--ink-2); padding-left: 18px; display: grid; gap: 6px; margin: 0 0 20px; }
  .empty-ip code { font-family: var(--mono); font-size: 12.5px; background: var(--rail); padding: 1px 5px; border-radius: 4px; color: var(--ink); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); opacity: 0; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; transition: opacity .2s var(--ease), transform .2s var(--ease); pointer-events: none; }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) {
    .tester, .lander { grid-template-columns: 1fr; }
    .persona { grid-template-columns: 1fr; }

/* Side-by-Side Queue Renderer */
function renderApprovalQueue() {
  const container = $("#approval-queue-list");
  const pill = $("#queue-count-pill");
  if (!container) return;
  const list = state.approvalQueue || [];
  if (pill) pill.textContent = `${list.length} Pending`;

  if (list.length === 0) {
    container.innerHTML = `
      <div style="border:1px dashed var(--line);border-radius:var(--radius);padding:28px 24px;text-align:center;background:var(--surface);">
        <div style="font-weight:600;font-size:14px;color:var(--ink);margin-bottom:4px;">No Pending Replies in Queue</div>
        <div style="color:var(--ink-3);font-size:13px;max-width:440px;margin:0 auto 16px;">The radar is caught up. Pick a scanner topic above or click "Run Scanner" to intercept fresh complaint threads on Threads.</div>
        <button class="btn btn-sm btn-ghost" onclick="document.querySelector('#run-batch-btn').click()">Trigger Radar Scanner ↗</button>
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(item => `
    <div class="approval-card">
      <div class="approval-card-head">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="pill pill-ok" style="font-weight:600;font-size:12px;">Slot #${item.matched_slot}: ${esc(item.product_name)}</span>
          <span style="font-size:13px;color:var(--ink-2);">Author: <strong>@${esc(item.author_username)}</strong></span>
        </div>
        <a href="${item.thread_url}" target="_blank" rel="noopener" class="btn btn-sm btn-ghost" style="font-size:12px;">Open Thread ${icons.external}</a>
      </div>

      <!-- Side-by-Side Split Grid -->
      <div class="approval-split">
        <!-- Left: Threads Complaint Post -->
        <div class="col-complaint">
          <div class="col-tag-row">
            <span style="color:var(--ink-3);">Threads Complaint Post</span>
            <span class="pill pill-muted" style="font-size:11px;">Target Post</span>
          </div>
          <p class="col-body">“${esc(item.thread_text)}”</p>
        </div>

        <!-- Right: Emma's 4-Part Honest Reply -->
        <div class="col-reply">
          <div class="col-tag-row">
            <span style="color:var(--accent);font-weight:600;">Emma's 4-Part Honest Reply</span>
            <span class="pill pill-ok" style="font-size:11px;">Bio #${item.matched_slot}</span>
          </div>
          <p class="col-body">“${esc(item.draft_reply)}”</p>
        </div>
      </div>

      <div class="approval-card-actions">
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-accent approve-btn" data-id="${item.id}" style="background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;">✓ Approve & Dispatch</button>
          <button class="btn btn-sm btn-ghost reject-btn" data-id="${item.id}" style="color:var(--danger);">✕ Discard</button>
        </div>
        <span style="font-size:11.5px;color:var(--ink-3);font-family:var(--mono);">Never Lie verified · Strict Context Pass</span>
      </div>
    </div>
  `).join("");

  // Re-bind actions
  container.querySelectorAll(".approve-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      btn.disabled = true;
      btn.textContent = "Dispatching to Threads…";
      try {
        await fetch("/api/queue/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: Number(id) })
        });
        toast("Reply approved! Dispatched in background.");
        setTimeout(async () => {
          await fetchAnalytics();
          renderApprovalQueue();
        }, 3000);
      } catch (err) {
        toast("Error approving: " + err.message);
        btn.disabled = false;
      }
    });
  });

  container.querySelectorAll(".reject-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      btn.disabled = true;
      try {
        await fetch("/api/queue/reject", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: Number(id) })
        });
        toast("Draft discarded.");
        await fetchAnalytics();
        renderApprovalQueue();
      } catch (err) {
        toast("Error: " + err.message);
      }
    });
  });
}

/* ---------- Panel behaviour ---------- */
let logTimer = null;
function bindPanel(p) {
  clearInterval(logTimer);

  // Expand post
  document.querySelectorAll("[data-expand]").forEach(b => b.addEventListener("click", () => {
    const body = b.previousElementSibling;
    const open = body.classList.toggle("is-clamped");
    b.textContent = open ? "Show full post" : "Show less";
  }));

  // Copy post
  document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const post = p.posts.find(x => x.id === b.dataset.copy);
    await copy(post.text, b);
  }));

  // Publish post
  document.querySelectorAll("[data-publish]").forEach(b => b.addEventListener("click", () => publish(p, b)));

  // Sandbox testing
  const input = $("#sim-input");
  if (input) {
    document.querySelectorAll("[data-sample]").forEach(c => c.addEventListener("click", () => { input.value = c.dataset.sample; runMatch(p); }));
    $("#sim-run").addEventListener("click", () => runMatch(p));
    input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) runMatch(p); });
  }

  // Bio Lander Modal
  const openModal = () => {
    const m = $("#lander-modal");
    if (m) { m.hidden = false; setTimeout(() => m.classList.add("is-open"), 10); }
  };
  const closeModal = () => {
    const m = $("#lander-modal");
    if (m) { m.classList.remove("is-open"); setTimeout(() => m.hidden = true, 200); }
  };
  const openLanderBtn = $("#open-lander-btn");
  if (openLanderBtn) openLanderBtn.addEventListener("click", openModal);
  const viewLanderToggleBtn = $("#view-lander-toggle-btn");
  if (viewLanderToggleBtn) viewLanderToggleBtn.addEventListener("click", openModal);
  const closeLanderBtn = $("#close-lander-modal");
  if (closeLanderBtn) closeLanderBtn.addEventListener("click", closeModal);
  const reloadLanderBtn = $("#reload-lander-btn");
  if (reloadLanderBtn) reloadLanderBtn.addEventListener("click", () => {
    const ifr = $("#modal-lander-iframe");
    if (ifr) ifr.src = ifr.src;
    toast("Reloaded bio lander preview.");
  });

  // Scanner Topic Pills
  document.querySelectorAll(".topic-pill").forEach(pill => {
    pill.addEventListener("click", async () => {
      document.querySelectorAll(".topic-pill").forEach(x => x.classList.remove("is-active"));
      pill.classList.add("is-active");
      const q = pill.dataset.query;
      toast(`Triggering radar scan: "${q}"`);
      try {
        await fetch("/api/automation/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q, scrolls: 3 })
        });
        toast(`Radar dispatched! Monitoring GraphQL for "${q}"...`);
      } catch (err) {
        toast("Scan trigger error: " + err.message);
      }
    });
  });

  // Run Batch Scanner Button
  const runBatch = $("#run-batch-btn");
  if (runBatch) {
    runBatch.addEventListener("click", async () => {
      runBatch.disabled = true;
      runBatch.textContent = "Scanning Threads…";
      const activePill = document.querySelector(".topic-pill.is-active");
      const q = activePill ? activePill.dataset.query : "dog hair couch vacuuming";
      try {
        await fetch("/api/automation/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q, scrolls: 3 })
        });
        toast("GraphQL Sniffer started! Watch live console below.");
      } catch (err) {
        toast("Failed: " + err.message);
      } finally {
        setTimeout(() => {
          runBatch.disabled = false;
          runBatch.textContent = "🚀 Run Scanner (Batch 5)";
        }, 3000);
      }
    });
  }

  // Refresh DB Button
  const refreshBtns = [$("#refresh-db-btn"), $("#refresh-metrics-btn")];
  refreshBtns.forEach(btn => {
    if (btn) {
      btn.addEventListener("click", async () => {
        btn.textContent = "Refreshing…";
        await fetchAnalytics();
        render();
        toast("Analytics refreshed from SQLite.");
      });
    }
  });

  // Render Queue when on Radar workspace
  if (state.tab === "radar") {
    renderApprovalQueue();
  }

  // Edit slot metrics
  document.querySelectorAll(".edit-slot-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const slot = btn.dataset.slot;
      const curClicks = btn.dataset.clicks;
      const curSales = btn.dataset.sales;
      const curStatus = btn.dataset.status;

      const clicks = prompt(`Slot #${slot} — Amazon Clicks this week:`, curClicks);
      if (clicks === null) return;
      const sales = prompt(`Slot #${slot} — Amazon Orders/Sales count:`, curSales);
      if (sales === null) return;
      const newStatus = prompt(`Status tier (winner, testing, underperforming):`, curStatus);
      if (newStatus === null) return;

      try {
        const res = await fetch("/api/analytics/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            slot: Number(slot),
            amazon_clicks: Number(clicks),
            amazon_sales: Number(sales),
            status: newStatus.trim().toLowerCase()
          })
        });
        if (res.ok) {
          toast(`Slot #${slot} metrics updated!`);
          await fetchAnalytics();
          render();
        }
      } catch (err) {
        toast("Failed to update: " + err.message);
      }
    });
  });

  // Live polling for Radar console & queue
  if (state.tab === "radar") {
    logTimer = setInterval(async () => {
      await fetchLogs();
      const el = $("#crawler-live-log");
      if (el) {
        el.innerHTML = state.logs.length ? state.logs.slice(-30).map(esc).join("<br>") : '<span class="log-empty">Waiting for crawler trigger...</span>';
        el.scrollTop = el.scrollHeight;
      }
      try {
        const r = await fetch("/api/queue", { cache: "no-store" });
        if (r.ok) {
          const data = await r.json();
          if ((data.queue || []).length !== (state.approvalQueue || []).length) {
            state.approvalQueue = data.queue || [];
            renderApprovalQueue();
            const badge = $("#radar-pending-badge");
            if (badge) badge.textContent = state.approvalQueue.length;
          }
        }
      } catch {}
    }, 1500);
  }
}

function matchSlot(p, text) {
  const t = text.toLowerCase();
  const has = list => list.some(k => t.includes(k));
  for (const r of p.replyRules) {
    if (r.all ? r.all.every(has) : has(r.any)) return r.slot;
  }
  return null;
}

function runMatch(p) {
  const text = $("#sim-input").value.trim();
  const out = $("#sim-result");
  if (!text) { $("#sim-input").focus(); return; }
  const slot = matchSlot(p, text);
  if (!slot) {
    out.innerHTML = `<div class="result-empty"><strong>No slot matches this post</strong>${esc(p.persona)} stays quiet here. Replying off-topic reads as spam. Add a keyword rule if this should map to a product.</div>`;
    return;
  }
  const item = p.catalog.find(c => c.slot === slot);
  const reply = p.replies[slot];
  const lower = reply.toLowerCase();
  const bannedHit = p.banned.find(b => lower.includes(b));
  const hasLink = /https?:\/\/|amzn\.|\.com/.test(lower);
  out.innerHTML = `
    <div class="result-head"><span class="pill pill-ok">Slot #${slot}</span><span class="result-product">${esc(item.title)}</span></div>
    <p class="reply-text">${esc(reply)}</p>
    <div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn btn-sm" id="copy-reply">${icons.copy}Copy reply</button></div>
    <ul class="checks">
      <li class="${hasLink ? "is-fail" : ""}">${hasLink ? icons.x : icons.check}${hasLink ? "Contains a link" : "No links in the reply"}</li>
      <li class="${bannedHit ? "is-fail" : ""}">${bannedHit ? icons.x : icons.check}${bannedHit ? `Uses banned phrase “${esc(bannedHit)}”` : "No banned phrases"}</li>
      <li>${icons.check}Points to bio #${slot}</li>
    </ul>`;
  $("#copy-reply").addEventListener("click", e => copy(reply, e.currentTarget));
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  const orig = btn.innerHTML;
  btn.innerHTML = `${icons.check}Copied`; btn.classList.add("is-done");
  setTimeout(() => { btn.innerHTML = orig; btn.classList.remove("is-done"); }, 1600);
}

async function publish(p, btn) {
  const id = btn.dataset.publish;
  document.querySelectorAll("[data-publish]").forEach(b => b.disabled = true);
  btn.textContent = "Publishing…";
  try {
    const r = await fetch("/api/broadcast/publish", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    toast("Publishing in the background. This takes about a minute.");
    const started = Date.now();
    const poll = setInterval(async () => {
      await detectLive();
      if (state.published[id]) { clearInterval(poll); toast("Posted to Threads."); render(); }
      else if (Date.now() - started > 150000) { clearInterval(poll); toast("No confirmation yet. Check the Activity tab."); render(); }
    }, 5000);
  } catch (err) {
    toast(`Couldn't start publishing: ${err.message}`);
    render();
  }
}

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("is-on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("is-on"), 3200);
}

/* ---------- Boot ---------- */
async function boot() { readHash(); render(); await detectLive(); await Promise.all([fetchLogs(), fetchAnalytics()]); render(); }
if (sessionStorage.getItem(AUTH_KEY)) showApp(); else showGate();
</script>
